<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="50%" stop-color="#05080f"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="50%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffa600"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#25334d" stroke-width="4"/>

  <!-- Speed lines -->
  <path d="M 60 380 L 452 380" stroke="#1f2d42" stroke-width="6" stroke-linecap="round"/>
  <path d="M 120 410 L 400 410" stroke="#182333" stroke-width="4" stroke-linecap="round"/>
  <path d="M 40 250 L 140 250" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 60 270 L 170 270" stroke="#ff3366" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Modern Sportscar Silhouette -->
  <g transform="translate(46, 170)">
    <!-- Body glow -->
    <path d="M 60 140 C 90 140 120 125 150 110 C 200 85 270 85 320 110 C 350 125 380 135 410 140 C 425 142 430 155 410 160 C 370 170 330 175 250 175 C 170 175 100 170 50 160 C 35 155 40 140 60 140 Z" fill="url(#carGrad)" filter="url(#neon)"/>
    <!-- Cabin Roof -->
    <path d="M 160 105 C 190 60 220 50 270 50 C 320 50 345 75 365 105 Z" fill="#0c121e" stroke="#ff6b35" stroke-width="4"/>
    <!-- Windshield & Window -->
    <path d="M 175 100 C 198 68 222 60 262 60 L 262 100 Z" fill="url(#glowGrad)" opacity="0.85"/>
    <path d="M 272 60 C 310 60 330 80 348 100 L 272 100 Z" fill="url(#glowGrad)" opacity="0.7"/>
    <!-- Headlight beam -->
    <polygon points="410,145 480,120 490,170" fill="url(#glowGrad)" opacity="0.35"/>
    <ellipse cx="408" cy="145" rx="8" ry="4" fill="#00f2fe" filter="url(#neon)"/>
    <!-- Taillight -->
    <ellipse cx="60" cy="148" rx="8" ry="4" fill="#ff3366" filter="url(#neon)"/>
    <!-- Rear Spoiler -->
    <path d="M 50 115 L 90 115 L 75 135 L 55 135 Z" fill="#ff3366"/>
    <!-- Wheels -->
    <g transform="translate(115, 155)">
      <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#ffa600" stroke-width="6"/>
      <circle cx="0" cy="0" r="16" fill="#1e293b"/>
      <circle cx="0" cy="0" r="8" fill="#ffa600"/>
    </g>
    <g transform="translate(345, 155)">
      <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#ffa600" stroke-width="6"/>
      <circle cx="0" cy="0" r="16" fill="#1e293b"/>
      <circle cx="0" cy="0" r="8" fill="#ffa600"/>
    </g>
  </g>
  
  <!-- Title text -->
  <text x="256" y="455" font-family="'Orbitron', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">APEX DRIFT 3D</text>
</svg>